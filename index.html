<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Efeito Doppler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Efeito Doppler</h1>
        <p>Calculadora de frequência aparente</p>

        <label>Velocidade do observador (m/s):</label>
        <input type="number" id="observador" value="0">

        <label>Velocidade da fonte (m/s):</label>
        <input type="number" id="fonte" value="0">

        <label>Velocidade do som (m/s):</label>
        <input type="number" id="som" value="343">

        <label>Frequência da fonte (Hz):</label>
        <input type="number" id="frequencia" value="440">

        <button onclick="calcularDoppler()">
            Calcular
        </button>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
